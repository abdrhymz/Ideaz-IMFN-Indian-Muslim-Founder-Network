name: "🐛 Bug Report"
description: "Something's broken? Help us fix it — every fix is sadaqah."
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **JazakAllah khair** for reporting this. The more detail you give, the faster we can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: "What happened?"
      description: "Describe the bug clearly."
      placeholder: "When I click the founder directory filter, the page goes blank..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to reproduce"
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: false
  - type: dropdown
    id: where
    attributes:
      label: "Where did this happen?"
      options:
        - "Website / Portal"
        - "Repo / Docs"
        - "Discord / Community space"
        - "Other"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: "Browser / Device (optional)"
      placeholder: "e.g. Chrome on Android, Safari on iPhone"
    validations:
      required: false
  - type: checkboxes
    id: coc
    attributes:
      label: "Adab check"
      options:
        - label: "I'm reporting this kindly and honestly, following the Code of Conduct."
          required: true
